  }

  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random()-0.5) * shake, (Math.random()-0.5) * shake);
    }

    drawSky();
    drawStars();
    drawSunMoon();
    drawClouds();
    drawHills();
    drawWeather();
    drawPipes();
    for (let i = 0; i < coinItems.length; i++) drawCoin(coinItems[i].x, coinItems[i].y);
    drawGround();

    // day/night darkening over background + obstacles (multiply blend)
    if (nightAmount > 0.03) {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      const shade = 255 - 130 * nightAmount;
      ctx.fillStyle = 'rgba(' + Math.round(shade) + ',' + Math.round(shade + 10) + ',' + Math.round(255 - 40*nightAmount) + ',1)';
      ctx.fillRect(0, 0, W, H - GROUND_H + 20);
      ctx.restore();
    }

    // dash speed lines
    if (dashFlash > 0) {
      ctx.save();
      ctx.globalAlpha = dashFlash * 0.5;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        const ly = 60 + i * 90 + Math.sin(frame*0.2+i)*10;
        ctx.beginPath();
        ctx.moveTo(alex.x - 60 - i*10, ly);
        ctx.lineTo(alex.x - 10, ly);
        ctx.stroke();
      }
      ctx.restore();
    }

    if (poop.x + 40 > -50) drawPoop(poop.x, poop.y, poop.scale, poop.intensity);

    if (invincibleTimer > 0 && state === 'playing') {
      ctx.save();
      ctx.translate(alex.x, alex.y);
      const glowPulse = 1 + Math.sin(frame * 0.3) * 0.15;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = dashTimer > 0 ? '#ff9f43' : '#ffd93d';
      ctx.beginPath(); ctx.arc(0, 0, 26 * glowPulse, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    drawCharacter(alex.x, alex.y, alex.rot, currentSkin);
    // boss module: boss/bullets/hazards/pickups drawn on top of the ongoing scene
    if (bossActive) renderBossOverlay();

    for (let i = 0; i < particles.length; i++) {
      const pt = particles[i];
      ctx.save();
      ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2.5, pt.y - 2.5, 5, 5);
      ctx.restore();
    }

    for (let i = 0; i < popups.length; i++) {
      const pu = popups[i];
      ctx.save();
      ctx.globalAlpha = clamp(pu.life / 1.1, 0, 1);
      ctx.font = 'bold 18px "Baloo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = pu.color;
      ctx.fillText(pu.text, pu.x, pu.y);
      ctx.restore();
    }

    ctx.restore();

    if (state === 'playing') {
      drawTextCentered(String(score), 70, 48, '#fff');
      if (multiplier > 1) {
        drawTextCentered('x' + multiplier, 108, 20, '#ff9f43');
      }
      drawIconParts([
        { type: 'coin', r: 8 },
        { type: 'text', value: String(coinCount), font: 'bold 15px "Baloo 2", sans-serif', color: '#ffd93d' }
      ], 12, H - GROUND_H - 10);
      if (extraLives > 0) {
        drawIconParts([
          { type: 'heart', r: 9, color: '#ff6b81' },
          { type: 'text', value: 'x' + extraLives, font: 'bold 15px "Baloo 2", sans-serif', color: '#ff6b81' }
        ], 12, H - GROUND_H - 32);
      }

      let hudY = 30;
      if (invincibleTimer > 0) {
        const buffColor = dashTimer > 0 ? '#ff9f43' : '#ffd93d';
        drawIconParts([
          { type: dashTimer > 0 ? 'dash' : 'shield', r: 9, color: buffColor },
          { type: 'text', value: invincibleTimer.toFixed(1) + ' с', font: 'bold 15px "Baloo 2", sans-serif', color: buffColor }
        ], 12, hudY);
      }
      if (widenTimer > 0) {
        const parts = [
          { type: 'widen', r: 9, color: '#5fe3ff' },
          { type: 'text', value: widenTimer.toFixed(1) + ' с', font: 'bold 15px "Baloo 2", sans-serif', color: '#5fe3ff' }
        ];
        drawIconParts(parts, W - 12 - measureIconParts(parts), hudY);
      }
      if (magnetTimer > 0) {
        const parts = [
          { type: 'magnet', r: 9, color: '#c77dff' },
          { type: 'text', value: magnetTimer.toFixed(1) + ' с', font: 'bold 15px "Baloo 2", sans-serif', color: '#c77dff' }
        ];
        drawIconParts(parts, W - 12 - measureIconParts(parts), hudY + 24);
      }

      for (let i = 0; i < banners.length; i++) {
        const b = banners[i];
        const a = clamp(b.life / 1.8, 0, 1);
        const scaleB = 1 + (1 - a) * 0.15;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(W/2, 160);
        ctx.scale(scaleB, scaleB);
        drawPanel(-130, -28, 260, 44, 16, 'rgba(15,18,32,0.72)', 'rgba(255,255,255,0.25)', 2);
        setBannerFont(b.text, 230, 20);
        ctx.textAlign = 'center';
        ctx.fillStyle = b.color;
        ctx.fillText(b.text, 0, 0);
        ctx.restore();
      }
    }

    if (state === 'ready') {
      drawTextCentered(playerName + ' убегает', 190, 30, '#fff', 'bold', true);
      drawTextCentered('от какашки!', 224, 30, '#fff', 'bold', true);
      drawTextCentered('Тапай, чтобы не упасть', 460, 16, '#fff', '600', true);
      drawDifficultyButtons();
      drawShopButton();
      drawRatingButtonReady();
      drawNameButton();
      if (best > 0) drawTextCentered('Рекорд: ' + best, 40, 16, '#fff2b0', 'bold', true);
    }

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      const cardW = 260, cardH = 210, cardX = W/2 - cardW/2, cardY = 195;
      const cardBg = ctx.createLinearGradient(0, cardY, 0, cardY + cardH);
      cardBg.addColorStop(0, 'rgba(32,26,46,0.9)');
      cardBg.addColorStop(1, 'rgba(18,15,28,0.92)');
      drawPanel(cardX, cardY, cardW, cardH, 20, cardBg, 'rgba(255,255,255,0.18)', 2);
      drawTextCentered('ПОЙМАЛА!', 235, 36, '#ff6b6b', 'bold', true);
      drawTextCentered('Счёт: ' + score, 280, 22, '#fff', 'bold', true);
      drawIconPartsCentered([
        { type: 'coin', r: 9 },
        { type: 'text', value: 'Монеты: ' + coinCount, font: 'bold 17px "Baloo 2", sans-serif', color: '#ffd93d' }
      ], W/2, 310);
      drawTextCentered('Рекорд: ' + best, 338, 18, '#fff2b0', 'bold', true);
      drawRatingButtonGameover();
      drawTextCentered('Нажми, чтобы попробовать снова', 430, 15, '#fff', '600');
    }

    if (state === 'shop') {
      drawShop();
    }

    drawMuteButton();
  }

  // ================================================================
  // BOSS BATTLE MODULE v2 — runs as an OVERLAY on top of normal play.
  // Normal pipes, scoring, ground/ceiling collision and the extra-life
  // system are completely untouched and keep running the whole time
  // (state stays 'playing'); the boss just shows up alongside them and
  // adds its own hazards + auto-fire damage race. Any hit from a boss
  // hazard reuses the existing triggerCaught()/extraLives/invincibleTimer
  // flow, so it's exactly as fair (and exactly as lethal on the ground)
  // as the rest of the game.
  // DEBUG TRIGGER: press "B" during a normal run to preview a fight.
  // Real integration (every 100 score) is not wired yet — call
  // startBossBattle() from the scoring code once you're happy with it.
  // ================================================================

  const BOSS_DEFS = [
    { id: 'poopKing', name: 'КОРОЛЬ КАКАШКА', maxHp: 170 }
    // add future bosses here — bossIndex cycles through this list
  ];

  const BOSS_REST_X = 300;      // where the boss hovers once it's done sliding in
  const BOSS_Y_MIN = 60;
  const BOSS_Y_MAX = H - GROUND_H - 60;
  const PLAYER_SHOT_INTERVAL = 0.22;
  const PLAYER_BULLET_SPEED = 430;
  const BOSS_BULLET_SPEED = 130;
  const PICKUP_GLYPH = { atk: 'dash', shield: 'shield', heal: 'heart', bigshot: 'widen' };
  const PICKUP_COLOR = { atk: '#ff9f43', shield: '#ffd93d', heal: '#ff6b81', bigshot: '#5fe3ff' };

  let bossActive = false;
  let boss = null;              // { def, hp, maxHp, x, y, targetY, phase, introT, windup, windupType }
  let bossIndex = 0;
  let bossAttackTimer = 0;
  let bossDash = null;          // active dash-through attack, if any
  let bossOutro = null;         // 'victory' once hp hits 0, then a short pause
  let bossOutroTimer = 0;

  let bossBullets = [];
  let bossWalls = [];           // thrown debris pairs — same idea as normal pipes
  let bossPickups = [];
  let bossPickupTimer = 0;

  let playerBullets = [];
  let playerShotTimer = 0;
  let playerAtkBoost = 0;
  let playerBigShotReady = false;

  function startBossBattle() {
    if (bossActive) return;
    const def = BOSS_DEFS[bossIndex % BOSS_DEFS.length];
    boss = { def: def, hp: def.maxHp, maxHp: def.maxHp, phase: 1,
              x: W + 60, y: alex.y, targetY: alex.y, introT: 1.0,
              windup: 0, windupType: null };
    bossActive = true;
    bossAttackTimer = 2.2;
    bossDash = null;
    bossOutro = null;
    bossBullets = []; bossWalls = []; bossPickups = [];
    bossPickupTimer = 3;
    playerBullets = [];
    playerShotTimer = 0;
    playerAtkBoost = 0; playerBigShotReady = false;
    shake = 6;
    banners.push({ text: def.name + '!', life: 2, color: '#ff6b6b' });
  }

  function endBossBattle(victory) {
    if (victory) bossIndex++;
    bossActive = false;
    boss = null;
    bossOutro = null;
  }

  function fireBullet(fromY) {
    const dmg = playerBigShotReady ? 14 : 3;
    playerBullets.push({ x: alex.x + alex.w/2, y: fromY, vx: PLAYER_BULLET_SPEED, dmg: dmg, big: playerBigShotReady });
    spawnBurst(alex.x + alex.w/2, fromY, playerBigShotReady ? '#ffd93d' : '#5fe3ff', playerBigShotReady ? 8 : 2);
    playerBigShotReady = false;
  }

  function damageBoss(amount, x, y) {
    if (!boss || bossOutro) return;
    boss.hp = Math.max(0, boss.hp - amount);
    spawnBurst(x, y, '#ffe89c', 4);
    const frac = boss.hp / boss.maxHp;
    const phase = frac > 0.7 ? 1 : (frac > 0.35 ? 2 : 3);
    if (phase > boss.phase) {
      boss.phase = phase;
      shake = Math.max(shake, 8);
      vib([20, 20, 20]);
      banners.push({ text: phase === 3 ? 'ФИНАЛЬНАЯ ФАЗА!' : 'ВТОРАЯ ФАЗА!', life: 1.6, color: '#ff9f43' });
    }
    if (boss.hp <= 0) {
      bossOutro = 'victory';
      bossOutroTimer = 2.2;
      bossWalls = []; bossBullets = [];
      sndMilestone();
      vib([30, 40, 30]);
      shake = 12;
      spawnBurst(boss.x, boss.y, '#ff6b6b', 24);
      wallet += 40;
      saveWallet();
      const locked = SKINS.find(function(s){ return unlockedSkins.indexOf(s.id) === -1; });
      if (locked) {
        unlockedSkins.push(locked.id);
        saveSkins();
        popups.push({ x: alex.x, y: alex.y - 60, text: 'Новый скин: ' + locked.name + '!', life: 1.8, color: '#5fe3ff' });
      }
      banners.push({ text: 'ПОБЕДА! +40 монет', life: 2.2, color: '#7cfc00' });
    }
  }

  // any boss hazard hitting the player reuses the exact same fairness rules
  // as everything else in the game — a shield blocks it, an extra life
  // absorbs it, otherwise it ends the run exactly like hitting the ground
  function bossHitPlayer() {
    if (invincibleTimer > 0) return;
    const before = state;
    triggerCaught();
    if (state !== before) {
      bossActive = false;
      boss = null;
    }
  }

  function spawnBossPickup() {
    const types = ['atk', 'shield', 'heal', 'bigshot'];
    const type = types[Math.floor(Math.random() * types.length)];
    // big, and spread across the whole screen ahead of the player —
    // not clustered next to the boss
    bossPickups.push({
      x: alex.x + 80 + Math.random() * (W - alex.x - 140),
      y: BOSS_Y_MIN + Math.random() * (BOSS_Y_MAX - BOSS_Y_MIN),
      type: type, r: 24
    });
  }

  function beginBossAttack(type) {
    boss.windupType = type;
    // short, purely physical wind-up (the boss itself shakes/glows) —
    // no on-screen arrows or captions, so it stays a little unpredictable
    boss.windup = type === 'dash' ? 0.5 : (type === 'wallThrow' ? 0.4 : 0.35);
  }

  function resolveBossAttack() {
    const type = boss.windupType;
    boss.windupType = null;
    if (type === 'wallThrow') {
      // the boss's signature move: it hurls debris in from off-screen,
      // exactly like a normal pipe, leaving one gap near the player
      const gapY = clamp(alex.y - 80 + (Math.random() - 0.5) * 70, 20, H - GROUND_H - 170);
      bossWalls.push({ x: W + 30, gapY: gapY, gapH: 160 });
      sndWiden();
    } else if (type === 'bullet') {
      const shots = boss.phase >= 3 ? [-16, 0, 16] : [0];
      for (let i = 0; i < shots.length; i++) {
        bossBullets.push({ x: boss.x - 20, y: boss.y + shots[i], vx: -BOSS_BULLET_SPEED, r: 9 });
      }
      sndDash();
    } else {
      bossDash = { t: 0, duration: 0.8, laneY: boss.y, hit: false };
      shake = Math.max(shake, 6);
      sndPunch();
    }
  }

  function updateBossOverlay(dt) {
    if (!boss) return;

    if (bossOutro) {
      bossOutroTimer -= dt;
      boss.y += (alex.y - boss.y) * Math.min(dt * 1.2, 1);
      if (bossOutroTimer <= 0) endBossBattle(true);
      return;
    }

    if (boss.introT > 0) {
      boss.introT -= dt;
      boss.x += (BOSS_REST_X - boss.x) * Math.min(dt * 3, 1);
      boss.y += (alex.y - boss.y) * Math.min(dt * 2, 1);
      boss.targetY = boss.y;
      return;
    }

    // constant, lively movement — bobs up/down and sways side to side
    // between attacks so it never just sits there; both widen and speed
    // up in later phases. The two motions are out of phase so it reads
    // as flying a loose loop rather than a straight line or perfect circle.
    boss.wanderT = (boss.wanderT || 0) + dt;
    if (!boss.windupType && !bossDash) {
      const swaySpeed = 0.5 + boss.phase * 0.15;
      const swayRange = 60 + boss.phase * 10;
      const bobSpeed = 0.7 + boss.phase * 0.2;
      const bobRange = 70 + boss.phase * 15;
      const midY = (BOSS_Y_MIN + BOSS_Y_MAX) / 2;
      const targetX = BOSS_REST_X + Math.sin(boss.wanderT * swaySpeed) * swayRange;
      boss.targetY = clamp(midY + Math.sin(boss.wanderT * bobSpeed + 1.3) * bobRange, BOSS_Y_MIN, BOSS_Y_MAX);
      boss.x += (targetX - boss.x) * Math.min(dt * 2, 1);
    }
    boss.y += (boss.targetY - boss.y) * Math.min(dt * 2.4, 1);

    // player auto-fire
    playerShotTimer -= dt;
    if (playerShotTimer <= 0) {
      playerShotTimer = PLAYER_SHOT_INTERVAL;
      fireBullet(alex.y);
      if (playerAtkBoost > 0) fireBullet(alex.y - 16);
    }
    if (playerAtkBoost > 0) playerAtkBoost = Math.max(0, playerAtkBoost - dt);
    for (let i = playerBullets.length - 1; i >= 0; i--) {
      const b = playerBullets[i];
      b.x += b.vx * dt;
      const dx = b.x - boss.x, dy = b.y - boss.y;
      if (Math.sqrt(dx*dx + dy*dy) < 22) {
        damageBoss(b.dmg, b.x, b.y);
        playerBullets.splice(i, 1);
      } else if (b.x > W + 20) {
        playerBullets.splice(i, 1);
      }
    }

    // big pickups, spread across the screen
    bossPickupTimer -= dt;
    if (bossPickupTimer <= 0) {
      bossPickupTimer = 4.5 + Math.random() * 3;
      spawnBossPickup();
    }
    for (let i = bossPickups.length - 1; i >= 0; i--) {
      const p = bossPickups[i];
      p.x -= pipeSpeed * dt;
      const dx = alex.x - p.x, dy = alex.y - p.y;
      if (Math.sqrt(dx*dx + dy*dy) < p.r + 18) {
        if (p.type === 'atk') { playerAtkBoost = 8; popups.push({ x: alex.x, y: alex.y - 34, text: 'ДВОЙНОЙ ВЫСТРЕЛ!', life: 1.2, color: '#ff9f43' }); sndDash(); }
        else if (p.type === 'shield') { invincibleTimer = Math.max(invincibleTimer, SHIELD_DURATION); popups.push({ x: alex.x, y: alex.y - 34, text: 'ЩИТ!', life: 1.2, color: '#ffd93d' }); sndShield(); }
        else if (p.type === 'heal') { extraLives = Math.min(EXTRA_LIFE_MAX, extraLives + 1); popups.push({ x: alex.x, y: alex.y - 34, text: '❤️ +1 ЖИЗНЬ', life: 1.2, color: '#ff6b81' }); sndHeart(); }
        else { playerBigShotReady = true; popups.push({ x: alex.x, y: alex.y - 34, text: 'МОЩНЫЙ ВЫСТРЕЛ ГОТОВ!', life: 1.2, color: '#ffd93d' }); sndGolden(); }
        bossPickups.splice(i, 1);
      } else if (p.x < -40) {
        bossPickups.splice(i, 1);
      }
    }

    // attack scheduling — "wallThrow" (fly through the gap) stays the boss's
    // main move throughout, since it's the same skill as normal pipes;
    // bullets and the rarer dash mix in more as the fight escalates
    if (!boss.windupType && !bossDash) {
      bossAttackTimer -= dt;
      if (bossAttackTimer <= 0) {
        const pool = boss.phase === 1 ? ['wallThrow', 'wallThrow', 'wallThrow', 'bullet']
                   : boss.phase === 2 ? ['wallThrow', 'wallThrow', 'bullet', 'bullet']
                   : ['wallThrow', 'bullet', 'bullet', 'dash'];
        beginBossAttack(pool[Math.floor(Math.random() * pool.length)]);
        bossAttackTimer = boss.phase === 1 ? 2.6 : (boss.phase === 2 ? 2.1 : 1.7);
      }
    }
    if (boss.windupType) {
      boss.windup -= dt;
      if (boss.windup <= 0) resolveBossAttack();
    }
    if (bossDash) {
      bossDash.t += dt;
      const t = Math.min(bossDash.t / bossDash.duration, 1);
      boss.x = lerp(BOSS_REST_X, -90, t);
      boss.y = bossDash.laneY;
      if (!bossDash.hit) {
        const dx = alex.x - boss.x, dy = alex.y - boss.y;
        if (Math.sqrt(dx*dx + dy*dy) < 32) {
          bossDash.hit = true;
          bossHitPlayer();
        }
      }
      if (t >= 1) { bossDash = null; if (boss) boss.x = BOSS_REST_X; }
    }

    // boss bullets
    for (let i = bossBullets.length - 1; i >= 0; i--) {
      const b = bossBullets[i];
      b.x += b.vx * dt;
      const dx = alex.x - b.x, dy = alex.y - b.y;
      if (Math.sqrt(dx*dx + dy*dy) < b.r + alex.w/2) {
        bossBullets.splice(i, 1);
        bossHitPlayer();
      } else if (b.x < -30) {
        bossBullets.splice(i, 1);
      }
    }

    // thrown walls — travel at the same speed as the normal pipes so they
    // blend into the existing rhythm instead of feeling like a separate system
    for (let i = bossWalls.length - 1; i >= 0; i--) {
      const w = bossWalls[i];
      w.x -= pipeSpeed * dt;
      const within = Math.abs(w.x - alex.x) < 26;
      if (within && !w.passed) {
        w.passed = true;
        if (alex.y - alex.h/2 < w.gapY || alex.y + alex.h/2 > w.gapY + w.gapH) {
          bossHitPlayer();
        }
      }
      if (w.x < -60) bossWalls.splice(i, 1);
    }
  }

  function drawBossHealthBar() {
    if (!boss) return;
    // lives at the bottom of the screen, just above the coin/hearts HUD
    const barW = W - 40, barX = 20, barH = 16;
    const barY = H - GROUND_H - 74;
    ctx.fillStyle = '#fff';
    setBannerFont(boss.def.name, 220, 12);
    ctx.textAlign = 'center';
    ctx.fillText(boss.def.name, W/2, barY - 8);
    drawPanel(barX, barY, barW, barH, 8, 'rgba(20,10,10,0.6)', 'rgba(255,255,255,0.25)', 1.5);
    const frac = clamp(boss.hp / boss.maxHp, 0, 1);
    const g = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    g.addColorStop(0, '#ff6b6b'); g.addColorStop(1, '#c92c2c');
    roundRectPath(barX + 2, barY + 2, (barW - 4) * frac, barH - 4, 6);
    ctx.fillStyle = g; ctx.fill();
  }

  function renderBossOverlay() {
    if (!boss) return;

    // the only "warning" before an attack: the boss itself shakes and its
    // face gets angrier the closer the attack is — no arrows, no captions
    const winding = boss.windupType ? clamp(1 - boss.windup / 0.5, 0, 1) : 0;
    const jitter = winding > 0 ? winding * 5 : 0;
    const jx = jitter ? (Math.random() - 0.5) * jitter : 0;
    const jy = jitter ? (Math.random() - 0.5) * jitter : 0;
    const scale = 2.0;
    const baseIntensity = clamp(0.25 + (boss.phase - 1) * 0.25, 0, 1);
    const intensity = clamp(baseIntensity + winding * 0.55, 0, 1);
    drawPoop(boss.x + jx, boss.y + jy, scale, intensity);

    // small crown so it reads clearly as a boss, not just a bigger chaser
    ctx.save();
    ctx.translate(boss.x, boss.y - 44);
    ctx.scale(0.7, 0.7);
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath();
    ctx.moveTo(-14, 8); ctx.lineTo(-14, -4); ctx.lineTo(-7, 4); ctx.lineTo(0, -8);
    ctx.lineTo(7, 4); ctx.lineTo(14, -4); ctx.lineTo(14, 8); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();

    for (let i = 0; i < bossWalls.length; i++) {
      const w = bossWalls[i];
      ctx.fillStyle = '#6b4423';
      ctx.fillRect(w.x - 18, 0, 36, w.gapY);
      ctx.fillRect(w.x - 18, w.gapY + w.gapH, 36, H - GROUND_H - (w.gapY + w.gapH));
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(w.x - 18, 0, 6, w.gapY);
      ctx.fillRect(w.x - 18, w.gapY + w.gapH, 6, H - GROUND_H - (w.gapY + w.gapH));
    }
    // poop shots — little chunks flung from the boss, themed to match it,
    // with a faint trailing smear since they fly leftward
    for (let i = 0; i < bossBullets.length; i++) {
      const b = bossBullets[i];
      ctx.save();
      ctx.globalAlpha = 0.35;
      drawPoop(b.x + 14, b.y, 0.32, 0.3);
      ctx.restore();
      drawPoop(b.x, b.y, 0.42, 0.55);
    }
    // big pickups, easy to spot and grab
    for (let i = 0; i < bossPickups.length; i++) {
      const p = bossPickups[i];
      const pulse = 1 + Math.sin(frame * 0.15 + i) * 0.12;
      const glyphColor = PICKUP_COLOR[p.type];
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = glyphColor;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      ICON_GLYPHS[PICKUP_GLYPH[p.type]](p.x, p.y, p.r * 0.7, glyphColor);
    }
    for (let i = 0; i < playerBullets.length; i++) {
      const b = playerBullets[i];
      ctx.fillStyle = b.big ? '#ffd93d' : '#5fe3ff';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.big ? 10 : 6, b.big ? 5 : 3, 0, 0, Math.PI*2); ctx.fill();
    }

    drawBossHealthBar();
  }

  function frameLoop(ts) {
    requestAnimationFrame(frameLoop);
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.033);
    last = ts;
    update(dt);
    render();
  }

  resetGame();
  requestAnimationFrame(frameLoop);
})();
</script>

  // ================================================================
  // Firebase Firestore leaderboard — loaded as an ES module straight
  // from Google's CDN. No npm, no bundler, works as-is on GitHub Pages.
  // This exposes a tiny window.__leaderboard API that the main game
  // script (a classic script above) calls into. If firebaseConfig is
  // left empty below, or anything here fails (offline, blocked,
  // misconfigured project, etc.), window.__leaderboard.ready stays
  // false and the game shows "Рейтинг временно недоступен" — the
  // game itself is completely unaffected either way.
  // ================================================================
  window.__leaderboard = {
    ready: false,
    syncBestScore: async function () {},
    fetchTop10: async function () { throw new Error('unavailable'); }
  };

  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
    const {
      getFirestore, doc, setDoc, serverTimestamp,
      collection, query, orderBy, limit, getDocs
    } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');

    // TODO: вставь сюда свой firebaseConfig из консоли Firebase
    // (Project settings → General → "Your apps" → SDK setup and configuration)
    const firebaseConfig = {
      apiKey: "AIzaSyAvJ-UTHuz8A2BtskiOWwWcwVc7byZeuqA",
      authDomain: "kakashka73-31351.firebaseapp.com",
      projectId: "kakashka73-31351",
      storageBucket: "kakashka73-31351.firebasestorage.app",
      messagingSenderId: "814352408663",
      appId: "1:814352408663:web:895c80dcea83431c860312"
    };

    if (firebaseConfig && firebaseConfig.apiKey) {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.__leaderboard = {

          await setDoc(doc(db, 'scores', playerId), {

        fetchTop10: async function () {

  } catch (e) {

      ready: false,
      syncBestScore: async function () {},
      fetchTop10: async function () { throw e; }
    };
  }
